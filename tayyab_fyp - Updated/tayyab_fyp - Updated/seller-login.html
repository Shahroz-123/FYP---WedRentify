<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Login - WedRentify</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container login-page-container">
    <h1 style="color: #b91c1c;;">Seller Login</h1>
    <form id="sellerLoginForm">
      <input type="text" class="form-input" id="username" placeholder="Username" required><br><br>
      <input type="password" class="form-input" id="password" placeholder="Password" required><br><br>
      <button type="submit" class="login-btn seller login-btn">Login</button>
    </form>

    <p class="back-home"><a href="login.html" class="home-btn">← Back</a></p>
  </div>

  <script>
    document.getElementById("sellerLoginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const response = await fetch("http://127.0.0.1:8000/api/accounts/seller/login/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok) {
         
          // localStorage mein save karte hain token/session
          localStorage.setItem("sellerLoggedIn", "true");
          localStorage.setItem("sellerUsername", username);

          // seller dashboard par bhej dete hain
          window.location.href = "SellerDashbord.html";
        } else {
          alert("Login failed: " + (data.error || "Invalid credentials"));
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Something went wrong. Please try again.");
      }
    });
  </script>

</body>
</html>
