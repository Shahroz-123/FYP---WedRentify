  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id");
    let selectedProduct = null;
  async function getSellerEmail(username) {
        if (!username) return "N/A";
        
        try {
            // Fetch ALL users from the API
            const response = await fetch(`http://127.0.0.1:8000/api/accounts/users/`);
            if (!response.ok) throw new Error("Failed to fetch user list.");

            const allUsers = await response.json();
            
            // Find the specific seller whose username matches
            const seller = allUsers.find(u => u.username === username && u.type === 'Seller'); 

            if (seller) {
                console.log(`Seller Email Found: ${seller.email}`);
                return seller.email;
            } else {
                console.warn(`Seller with username '${username}' not found or is not a Seller.`);
                return "N/A";
            }
        } catch (error) {
            console.error("Error fetching seller email:", error);
            return "N/A";
        }
    }
    async function loadProduct() {
      try {
        const response = await fetch(`http://127.0.0.1:8000/api/rentals/list/`);
        const allProducts = await response.json();
        selectedProduct = allProducts.find(p => p.id == productId);

        if (!selectedProduct) {
          alert("Product not found!");
          return;
        }

        document.getElementById("product-image").src = selectedProduct.image || "placeholder.jpg";
        document.getElementById("product-title").textContent = selectedProduct.name;
        document.getElementById("product-description").textContent = selectedProduct.description || "No description.";
        document.getElementById("product-price").textContent = `Rs. ${selectedProduct.rent_price}`;
        document.getElementById("seller-username").textContent = selectedProduct.seller_username || "N/A";
        document.getElementById("seller-contact").textContent = selectedProduct.contact_number || "N/A";

        document.getElementById("product-details").innerHTML = `
          <p><strong>Color:</strong> ${selectedProduct.color || "N/A"}</p>
          <p><strong>Size:</strong> ${selectedProduct.size || "N/A"}</p>
          <p><strong>Length:</strong> ${selectedProduct.length || "N/A"}</p>
          <p><strong>City:</strong> ${selectedProduct.city || "N/A"}</p>
          <p><strong>Occasion:</strong> ${selectedProduct.occasion || "N/A"}</p>
          <p><strong>Category:</strong> ${selectedProduct.category || "N/A"}</p>
        `;   sellerEmail = await getSellerEmail(selectedProduct.seller_username);
      } catch (error) {
        console.error("Error loading product:", error);
      }
    }
    loadProduct();


    const rentBtn = document.getElementById("rent-btn");
    const rentModal = document.getElementById("rent-modal");
    const cancelBtn = document.getElementById("cancel-btn");

    rentBtn.addEventListener("click", () => rentModal.classList.remove("hidden"));
    cancelBtn.addEventListener("click", () => rentModal.classList.add("hidden"));

    document.getElementById("rent-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const loader = document.getElementById("loader");
    const confirmButton = e.submitter; 

    // 1. Show the loader (fullscreen) and disable the button immediately
    loader.classList.remove("hidden"); 
    if (confirmButton && confirmButton.type === 'submit') {
        confirmButton.disabled = true; // Prevents double-clicking
        confirmButton.textContent = 'Processing...'; // Optional: Change button text
    }
  const formData = new FormData(e.target);
  const orderData = Object.fromEntries(formData.entries());
  orderData.product_id = selectedProduct.id;
  orderData.product_name = selectedProduct.name;
  orderData.seller_username = selectedProduct.seller_username;
  orderData.seller_contact = selectedProduct.contact_number;
      orderData.seller_email = sellerEmail;
  try {
    // Save order
    const orderRes = await fetch("http://127.0.0.1:8000/api/rentals/rentorder/create/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderData)
    });

    if (!orderRes.ok) {
      throw new Error("Order creation failed!");
    }

    // Create Stripe payment
    const res = await fetch("http://127.0.0.1:8000/api/rentals/create-payment/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: selectedProduct.rent_price })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error("Payment creation failed: " + errText);
    }

    const data = await res.json();
    const stripe = Stripe("pk_test_51SI8MbQec5FN5Z5rJwkfdKlPJFTR4fI6xAagXM7zQxMF0gT9O36UiKUmzy33FLW7Xjho6RmJUvfJIl6ERiIgyAF800cKAULkLj");

    await stripe.redirectToCheckout({ sessionId: data.sessionId });
  } catch (err) {
    alert("❌ Error: " + err.message);
    console.error(err);
  }
});

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("buyer_id");
    localStorage.removeItem("buyer_username");
    window.location.href = "index.html";
  });
} else {
  navLoginCart.innerHTML = `

  `;
}
