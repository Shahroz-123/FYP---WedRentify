   transform: translateY(-2px); /* Subtle lift effect */

}

*/

  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05); /* A subtle 5% grow */
  }
  100% {

}

    <script>
     
    document.addEventListener("DOMContentLoaded", function () {
    const navLoginCart = document.querySelector(".nav-login-cart");

    // Check login status from localStorage/sessionStorage
    const isLoggedIn = localStorage.getItem("isLoggedIn");
     
    if (isLoggedIn === "true") {
        // Show Logout Button
        navLoginCart.innerHTML = `
            <button id="logoutBtn">Logout</button>
            <a href="cart.html"></a>
            
        `;

        // Logout Event
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("isLoggedIn");
             // Clear login status
             localStorage.removeItem("buyer_id");
             localStorage.removeItem("buyer_username");
            window.location.href = "index.html"; // Redirect to login page
        });
    } else {
        // Show Login Button
        navLoginCart.innerHTML = `
            <a href="login.html"><button>Login</button></a>
            <a href="cart.html"></a>
         
        `;
    }
});
document.getElementById("donation-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const buyer_username = localStorage.getItem("buyer_username");

  if (!buyer_username) {
    alert("Please log in before donating.");
    return;
  }

  formData.append("buyer_username", buyer_username);

  const response = await fetch("http://127.0.0.1:8000/api/donations/add/", {
    method: "POST",
    body: formData
  });

  const result = await response.json();
  if (response.ok) {
    alert(result.message || "🎉 Thank you for your donation!");
    this.reset();
  } else {
    alert("❌ Error: " + (result.error || "Something went wrong"));
  }
});
const container = document.getElementById("donations-container");
    const loggedInUser = localStorage.getItem("buyer_username");

    // ✅ Fetch all donation dresses
    async function loadDonations() {
  try {
    const res = await fetch("http://127.0.0.1:8000/api/donations/list/");
    const donations = await res.json();

    const loggedInUser = localStorage.getItem("buyer_username");

    if (!loggedInUser) {
      container.innerHTML = `<p class='col-span-full text-center text-gray-600'>
        Please log in to view your donations.
      </p>`;
      return;
    }

    // ✅ Filter donations to show only those owned by logged-in buyer
    const userDonations = donations.filter(d => d.buyer_username === loggedInUser);

    if (userDonations.length === 0) {
      container.innerHTML = `<p class='col-span-full text-center text-gray-600'>
        You haven't donated any dresses yet.
      </p>`;
      return;
    }

    // ✅ Display only the logged-in user's donations
    container.innerHTML = userDonations.map(d => `
      <div class="bg-white shadow-md rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="${d.dress_image ? d.dress_image : 'placeholder.jpg'}"
             class="h-64 w-full object-cover"
             alt="${d.dress_title}">

        <div class="p-4">
          <h2 class="text-lg font-semibold text-gray-800">${d.dress_title}</h2>
          <p class="text-sm text-gray-600 mb-2">${d.dress_description || 'No description available.'}</p>
          <p class="text-sm text-gray-700"><strong>Size:</strong> ${d.dress_size || 'N/A'}</p>
          <p class="text-sm text-gray-700"><strong>Donor:</strong> ${d.donor_name}</p>
          <p class="text-sm text-gray-700"><strong>Contact:</strong> ${d.donor_contact}</p>

          <button onclick="deleteDonation(${d.id})"
                  class="mt-3 w-full bg-red-700 text-white py-1 rounded hover:bg-red-800 transition">
            Delete Donation
          </button>
        </div>
      </div>
    `).join("");

  } catch (err) {
    console.error("Error loading donations:", err);
    container.innerHTML = `<p class='col-span-full text-center text-red-600'>
      Failed to load donations.
    </p>`;
  }
}


    // ✅ Delete donation (only if owned by logged-in donor)
    async function deleteDonation(id) {
      if (!confirm("Are you sure you want to delete this donation?")) return;

      try {
        const res = await fetch(`http://127.0.0.1:8000/api/donations/delete/${id}/`, {
          method: "DELETE"
        });

        if (res.ok) {
          alert("Donation deleted successfully!");
          loadDonations(); // refresh the list
        } else {
          alert("Failed to delete donation.");
        }
      } catch (error) {
        console.error("Error deleting donation:", error);
      }
    }

    // Load data initially
    loadDonations();
</script>
