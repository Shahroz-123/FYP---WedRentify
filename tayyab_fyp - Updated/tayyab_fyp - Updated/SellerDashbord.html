<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - WedRentify</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50">

  <!-- Navbar -->
  <div class="flex items-center justify-between px-4 md:px-8 border-b border-gray-500 py-3 bg-white">
    <a class="text-red-800 font-bold text-2xl" href="/">❤️ WedRentify</a>

    <div class="flex items-center gap-5 text-gray-700 relative">
      <p id="sellerName">Hi! Seller</p>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
      <button 
        class="text-red-600 border border-red-600 px-3 py-1 rounded hover:bg-red-600 hover:text-white transition"
        onclick="logoutSeller()">Logout</button>
    </div>
  </div>

  <!-- Dashboard Body -->
  <div class="flex">
    <!-- Sidebar -->
    <div class="md:w-64 w-16 border-r border-gray-300 min-h-screen text-base py-2 flex flex-col bg-white">
      <a href="SellerDashboard.html" class="flex items-center py-3.5 px-5 bg-red-800 text-white gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-4a2 2 0 01-2-2V12H9v8a2 2 0 01-2 2H5a2 2 0 01-2-2V10z" />
        </svg>
        <p>Dashboard</p>
      </a>

      <a href="SellerAddDresses.html" class="flex items-center py-3.5 px-5 gap-3 hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <p>Add Dresses</p>
      </a>

      <a href="SellerDresses.html" class="flex items-center py-3.5 px-5 gap-3 hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
        <p>My Dresses</p>
      </a>

      <a href="SellerBuyer.html" class="flex items-center py-3.5 px-5 gap-3 hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m5-3a4 4 0 100-8 4 4 0 000 8zm6 0a4 4 0 100-8 4 4 0 000 8z" />
        </svg>
        <p>Buyers</p>
      </a>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
      <div class="flex flex-wrap gap-6 mb-8">
        <!-- Active Orders -->
        <div class="flex items-center gap-3 shadow-md border border-red-800 py-4 w-56 rounded-md bg-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="pl-2 w-8 h-8 text-red-800" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m5-3a4 4 0 100-8 4 4 0 000 8zm6 0a4 4 0 100-8 4 4 0 000 8z" />
          </svg>
          <div>
            <p id="activeOrdersCount" class="text-2xl font-medium text-gray-600">0</p>
            <p class="text-base text-gray-500">Active Orders</p>
          </div>
        </div>

        <!-- Total Dresses -->
        <div class="flex items-center gap-3 shadow-md border border-red-800 py-4 w-56 rounded-md bg-white">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="pl-2 w-8 h-8 text-red-800">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <div>
            <p id="totalDressCount" class="text-2xl font-medium text-gray-600">0</p>
            <p class="text-base text-gray-500">Total Dresses</p>
          </div>
        </div>
      </div>

      <!-- Recent Buyers -->
      <div>
        <h2 class="pb-4 text-lg font-medium">Latest Buyers</h2>
        <div class="flex flex-col items-center max-w-4xl w-full overflow-hidden rounded-md bg-white border border-gray-300">
          <table class="table-fixed md:table-auto w-full">
            <thead class="bg-gray-100 border-b border-gray-300 text-sm text-left">
              <tr>
                <th class="px-4 py-3 text-center hidden sm:table-cell">#</th>
                <th class="px-4 py-3">Buyer Name</th>
                <th class="px-4 py-3">Dress Name</th>
              </tr>
            </thead>
            <tbody id="buyersTable" class="text-sm text-gray-700">
              <tr><td colspan="3" class="text-center py-4 text-gray-400">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

 <div class="mb-8 ml-70">
        <h2 class="pb-4 text-lg font-medium">Latest Auction Bidder</h2>
        <div id="winner-details-container" class="p-6 max-w-4xl w-full bg-white border border-gray-300 rounded-md shadow-md">
            <p class="text-gray-500">Loading latest bidder details...</p>
        </div>
    </div>
    <div>
      <!-- View Dry Cleaners Button -->
<div class="flex justify-center mt-10 mb-10">
    <a href="sellerdrycleaner.html"
       class="inline-flex items-center justify-center text-center p-4 
              bg-red-700 text-white font-bold 
              h-12 w-52 rounded-lg shadow-xl 
              hover:bg-red-800 transition 
              transform hover:scale-105">
        <span class="text-xl leading-snug">View Dry Cleaners</span>
    </a>
</div>
   
  <!-- Script -->
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      let sellerUsername = localStorage.getItem("sellerUsername");
      if (!sellerUsername) {
        alert("You must log in as a seller first!");
        window.location.href = "login.html";
        return;
      }

      document.getElementById("sellerName").textContent = "Hi! " + sellerUsername;

      const ordersUrl = `http://127.0.0.1:8000/api/rentals/seller-orders/${sellerUsername}/`;
      const dressesUrl = "http://127.0.0.1:8000/api/rentals/list/";

      try {
        // Fetch Orders
        const orderResponse = await fetch(ordersUrl);
        const orderData = await orderResponse.json();
        const allOrders = orderData.orders || orderData || [];

        document.getElementById("activeOrdersCount").textContent = allOrders.length;
const sortedOrders = allOrders.sort((a, b) => {
    // Note: The new Date() function safely handles the string format of the timestamp.
    return new Date(a.created_at) - new Date(b.created_at);
});

// 2. Get the last 5 elements (the newest 5) and reverse them so the latest is first (for display)
const latestBuyers = sortedOrders.slice(-5).reverse();
        const tableBody = document.getElementById("buyersTable");
        tableBody.innerHTML = "";

        if (latestBuyers.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-gray-400">No buyers found.</td></tr>`;
        } else {
          latestBuyers.forEach((buyer, i) => {
            tableBody.insertAdjacentHTML(
              "beforeend",
              `<tr class="border-b border-gray-200">
                <td class="px-4 py-3 text-center hidden sm:table-cell">${i + 1}</td>
                <td class="px-4 py-3">${buyer.full_name || "Unknown Buyer"}</td>
                <td class="px-4 py-3">${buyer.product_name || "N/A"}</td>
              </tr>`
            );
          });
        }

        // Fetch Dresses
        const dressResponse = await fetch(dressesUrl);
        const dressData = await dressResponse.json();
        const allDresses = dressData.dresses || dressData || [];

        const sellerDresses = allDresses.filter(
          (dress) => dress.seller_username?.toLowerCase() === sellerUsername.toLowerCase()
        );

        document.getElementById("totalDressCount").textContent = sellerDresses.length;
        const auctionUrl = "http://127.0.0.1:8000/api/auction/list/";
      const auctionResponse = await fetch(auctionUrl);
      
      if (!auctionResponse.ok) {
        throw new Error("Failed to fetch auction data.");
      }

      const auctionData = await auctionResponse.json();
      const allAuctions = auctionData.auctions || [];

      // 2. Sirf is seller ke auctions filter karein
      const myAuctions = allAuctions.filter(
        (auction) => auction.seller_username?.toLowerCase() === sellerUsername.toLowerCase()
      );

      // 3. Un auctions ko filter karein jin par koi bid lagi hai
      const biddedAuctions = myAuctions.filter(
        (auction) => auction.highest_bidder && auction.highest_bidder !== "No Bids Yet"
      );

      const container = document.getElementById("winner-details-container");
      
      if (biddedAuctions.length > 0) {
        // 4. Sab se pehla item uthayein (kyunke API naye items pehle bhejti hai)
        // Yeh aapka "last winner" hai (jo abhi active hai)
        const lastWinner = biddedAuctions[0]; 

        container.innerHTML = `
            <p class="text-base text-gray-700 mb-2">
                Your most recent active bid is on: <strong>${lastWinner.dress_name}</strong>
            </p>
            <p class="text-base text-gray-700 mb-1">
                Current Highest Bidder: <strong class="text-lg text-red-700">${lastWinner.highest_bidder}</strong>
            </p>
            <p class="text-base text-gray-700">
                Bidder's Contact: <strong class="text-lg text-red-700">${lastWinner.highest_bidder_contact || "Not Provided"}</strong>
            </p>
            <p class="text-sm text-gray-500 mt-4">
                Current Bid: Rs ${lastWinner.current_bid.toLocaleString()}
            </p>
        `;
      } else {
        // Is seller ki kisi item par koi bid nahi hai
        container.innerHTML = `<p class="text-gray-500">You have no active bids on your items right now.</p>`;
      }
      } catch (err) {
        console.error("Error fetching dashboard data:", err);
        alert("Failed to load data. Check your server and APIs.");
        document.getElementById("winner-details-container").innerHTML = `<p class="text-red-500">Could not load auction bidder details.</p>`;
      }
    });

    function logoutSeller() {
      localStorage.removeItem("sellerUsername");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
