    /* Styles for new elements, respecting your existing structure */

  padding: 12px 24px;         /* Adjust padding as needed */

 /* Example background color */

  /* --- This is the secret sauce --- */
  /* Tells the browser to animate changes to 'transform' and 'box-shadow' */
  /* It takes 0.3 seconds and has an 'ease' effect */
  transition: transform 0.3s ease, box-shadow 0.3s ease; 
}

/* 2. The :hover state (when the mouse is over it) */
.pop-out-button:hover {
  /* Scales the button to 110% of its original size */

   transform: translateY(-2px); /* Subtle lift effect */
    box-shadow: 0 6px 20px rgba(238, 115, 115, 0.6);
}
/* 1. Define the continuous "pulse" animation
*/
@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05); /* A subtle 5% grow */
  }
  100% {
    transform: scale(1);
  }

/* 2. Image Resizing (Forces height and content fit) */

    height: 250px !important; /* Standardized height */
    object-fit: cover !important; 
    border-top-left-radius: 10px !important;
    border-top-right-radius: 10px !important;

    padding: 0 !important; /* CRITICAL: Remove image padding/margin */

/* 3. Text Content Wrapper (Reduces vertical space) */
.p-product-con .card .p-text-con {

/* 4. Heading (Title) Size and Spacing */

/* 5. Contact/Seller Info (Smallest text) */

/* 6. Price/Seller Name Row (Using flex for horizontal alignment) */

/* 7. Auction Price Highlight */

/* 8. Button (The pink/maroon button) */

    width: 100% !important;

    border-radius: 0 0 10px 10px !important; /* Matches card bottom curve */

.card:hover {

}
.seller{

font-size: 30px !important;
font-weight: bolder;

<!--

=== DYNAMIC JAVASCRIPT LOGIC STARTING ===
=========================================
-->
<script>
    // --- Configuration ---
    // Your backend API endpoint for fetching auction items
    const AUCTION_API_URL = 'http://127.0.0.1:8000/api/auction/list/';
    const ITEMS_PER_PAGE = 12;

    // --- DOM Elements ---
    const auctionContainer = document.getElementById('auctionContainer');
    const paginationContainer = document.getElementById('paginationContainer');
    const loginLogoutBtn = document.getElementById('loginLogoutBtn');
    
    // To store all active countdown timers
    let activeTimers = [];

    // --- Main Functions ---

    /**
     * Fetches auction data from the backend for a specific page.
     */
    async function fetchAuctionData(page = 1) {
        // Clear old timers before fetching new data
        clearAllTimers();
        auctionContainer.innerHTML = `<h1 class="loading-text">Fetching auctions...</h1>`;
        paginationContainer.innerHTML = ''; // Clear old pagination

        try {
            // Fetch paginated data
            const response = await fetch(`${AUCTION_API_URL}?page=${page}&limit=${ITEMS_PER_PAGE}`);
            if (!response.ok) {
                throw new Error(`API Error: ${response.statusText}`);
            }
            
            const data = await response.json();

            // Check if data is valid and auctions exist
            if (!data.auctions || data.auctions.length === 0) {
                auctionContainer.innerHTML = `<h1 class="loading-text">No active auctions found.</h1>`;
                return;
            }

            // Clear loading text
            auctionContainer.innerHTML = '';
            
            // Render each card
            data.auctions.forEach(dress => {
                const card = createAuctionCard(dress);
                if (card) {
                    auctionContainer.appendChild(card);
                }
            });

            // Render pagination controls
            renderPagination(data.current_page, data.page_count);

        } catch (error) {
            console.error('Failed to fetch auction data:', error);
            auctionContainer.innerHTML = `<h1 class="error-text">Failed to load auctions. Please try again later.</h1>`;
        }
    }

    /**
     * Creates a single auction card element.
     */
    function createAuctionCard(dress) {
        // Calculate time remaining based on the server's deletion_time
        const now = new Date();
        const deletionTime = new Date(dress.deletion_time);
        const timeLeftMs = deletionTime.getTime() - now.getTime();

        // If the 4-hour window has passed, don't render the card
        if (timeLeftMs <= 0) {
            return null; // This item is expired
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `dress-${dress.id}`;

        // Construct the card's inner HTML
        card.innerHTML = `
            <div class="p-label">Auction</div>
            <img
                src="${dress.dress_image_url}" 
                alt="${dress.dress_name}"
                onerror="this.src='https://placehold.co/400x500/e91e63/ffffff?text=Image+Missing'"
            >
            <div class="p-text-con">
                <div class="p-card-text">
                    <h1>${dress.dress_name || 'Untitled Dress'}</h1>
                </div>
                
                 <div>
                    
                      <p class="seller">Seller Name:<br>${dress.seller_username}</p>
                    </div>
                    
                <div class="p-price">
                    <div>
                      <p class="seller">Seller Contact:<br>${dress.seller_contact}</p>
                    </div>
                   
                    <div>
                      
                        <span style="font-size: 0.9rem; color: #8B0000; font-weight: bolder;">Auction price:</span>
                        <h2>Rs ${dress.orginalprice.toLocaleString()}</h2>
                    </div>
                </div>
                <div>
                    <!-- The button now calls handleBidNow() with the dress ID -->
                    <button class="rentbtn" onclick="handleBidNow(${dress.id})">Bid Now!</button>
                </div>
            </div>
            <!-- Countdown Timer Display -->
            <div class="countdown-timer" data-deletion-time="${deletionTime.toISOString()}">
                ⏱️ Time Left: <span class="timer-display">Calculating...</span>
            </div>
        `;
        
        // Start the timer for this specific card
        startCountdownTimer(card.querySelector('.timer-display'), timeLeftMs, card);
        return card;
    }

    /**
     * Handles the "Bid Now" button click.
     */
    function handleBidNow(dressId) {
        const buyerUsername = localStorage.getItem("buyer_username");

        if (!buyerUsername) {
            alert("You must be logged in to place a bid.");
            window.location.href = "login.html"; // Redirect to login
        } else {
            // User is logged in, redirect to the detail page with the ID
            window.location.href = `AuctionDetailPage.html?id=${dressId}`;
        }
    }

    /**
     * Renders pagination buttons.
     */
    function renderPagination(currentPage, totalPages) {
        paginationContainer.innerHTML = ''; // Clear old buttons
        
        if (totalPages <= 1) return; // No pagination needed

        // "Previous" Button
        const prevButton = document.createElement('button');
        prevButton.textContent = '« Prev';
        prevButton.disabled = (currentPage === 1);
        prevButton.onclick = () => fetchAuctionData(currentPage - 1);
        paginationContainer.appendChild(prevButton);

        // Page Number Buttons (simplified for brevity)
        for (let i = 1; i <= totalPages; i++) {
            const pageButton = document.createElement('button');
            pageButton.textContent = i;
            if (i === currentPage) {
                pageButton.className = 'active';
            }
            pageButton.onclick = () => fetchAuctionData(i);
            paginationContainer.appendChild(pageButton);
        }

        // "Next" Button
        const nextButton = document.createElement('button');
        nextButton.textContent = 'Next »';
        nextButton.disabled = (currentPage === totalPages);
        nextButton.onclick = () => fetchAuctionData(currentPage + 1);
        paginationContainer.appendChild(nextButton);
    }

    // --- Timer Logic ---

    /**
     * Starts a countdown timer for a specific card.
     */
    function startCountdownTimer(timerElement, timeLeftMs, cardElement) {
        const updateTimer = () => {
            if (timeLeftMs <= 0) {
                clearInterval(intervalId);
                timerElement.textContent = "EXPIRED";
                // Remove the card from the page once the timer hits zero
                if(cardElement) {
                    cardElement.remove();
                }
                return;
            }

            // Calculate hours, minutes, seconds
            let seconds = Math.floor((timeLeftMs / 1000) % 60);
            let minutes = Math.floor((timeLeftMs / (1000 * 60)) % 60);
            let hours = Math.floor((timeLeftMs / (1000 * 60 * 60))); // Total hours left

            const pad = (n) => n.toString().padStart(2, '0');
            // Format: 03h : 59m : 01s
            timerElement.textContent = `${pad(hours)}h : ${pad(minutes)}m : ${pad(seconds)}s`;

            timeLeftMs -= 1000;
        };

        // Run immediately to show time
        updateTimer(); 
        
        // Start the 1-second interval
        const intervalId = setInterval(updateTimer, 1000);
        activeTimers.push(intervalId); // Store for cleanup
    }

    /**
     * Clears all active timers (e.g., when changing page).
     */
    function clearAllTimers() {
        activeTimers.forEach(timerId => clearInterval(timerId));
        activeTimers = [];
    }

    /**
     * Updates the login/logout button based on local storage.
     */
    function checkBuyerLogin() {
        const buyerUsername = localStorage.getItem("buyer_username");
        if (buyerUsername) {
            loginLogoutBtn.textContent = 'Logout';
            loginLogoutBtn.onclick = () => {
                localStorage.removeItem("buyer_username");
                window.location.reload(); // Refresh to update state
            };
        } else {
            loginLogoutBtn.textContent = 'Login';
            loginLogoutBtn.onclick = () => window.location.href = 'login.html';
        }
    }

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', () => {
        checkBuyerLogin();
        fetchAuctionData(1); // Load the first page of auctions
    });

</script>
