    // Function to check local storage and update the seller's name in the navbar
function updateSellerName() {
    // 1. Get the username from local storage
    const sellerUsername = localStorage.getItem("sellerUsername");
    
    // 2. Get the HTML element where the name should be displayed
    const sellerNameElement = document.getElementById("sellerName");

    // 3. Check if the element exists and if a username was found
    if (sellerNameElement) {
        if (sellerUsername && sellerUsername.trim() !== "") {
            // Display "Hi! [Username]"
            sellerNameElement.textContent = `Hi! ${sellerUsername}`;
        } else {
            // Display the default greeting if no username is found
            sellerNameElement.textContent = "Hi! Seller";
        }
    }
}

// Execute the function when the script runs (as soon as the DOM is ready)
updateSellerName();
    // ✅ Tab switching
    function openTab(evt, formId) {
      document.querySelectorAll(".tab-content").forEach(tab => tab.style.display = "none");
      document.querySelectorAll(".tab-link").forEach(link => {
        link.classList.remove("border-black", "text-black", "font-semibold");
        link.classList.add("text-gray-500");
      });
      document.getElementById(formId).style.display = "block";
      evt.currentTarget.classList.add("border-black", "text-black", "font-semibold");
      evt.currentTarget.classList.remove("text-gray-500");
    }

    // ✅ Handle Rent form submit
    const rentForm = document.getElementById("rentForm");
    let cachedFormData = null; // dress form data store karega

    rentForm.addEventListener("submit", function(e){
      e.preventDefault();
      cachedFormData = new FormData(rentForm);
      const rentPrice = cachedFormData.get("rent_price");
      if(!rentPrice){
        alert("❌ Enter rent price first!");
        return;
      }
      const deposit = (parseFloat(rentPrice) * 0.1).toFixed(2);
      document.getElementById("depositAmount").innerText = deposit;
      document.getElementById("depositModal").classList.remove("hidden");
      document.getElementById("depositModal").classList.add("flex");
    });

    function closeModal(){
      document.getElementById("depositModal").classList.add("hidden");
      document.getElementById("depositModal").classList.remove("flex");
    }

// ✅ Converts uploaded image to Base64 string
// ✅ Converts uploaded image to Base64 string
async function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        // Read the file as a data URL
        reader.readAsDataURL(file); 
        
        reader.onload = () => {
            // Split the result to get ONLY the Base64 data part (after the comma)
            const base64String = reader.result.split(",")[1];
            // WARNING: Large files can still cause issues here.
            resolve(base64String);
        };
        
        reader.onerror = (error) => reject(error);
    });
}

// ✅ Uses Gemini API to detect dress condition with better error handling

// --- Naye Loading Functions ---
function showLoader(message = "Processing...") {
    // Ye function loading modal ko dikhayega
    document.getElementById("loadingModal").querySelector('p').innerText = message;
    document.getElementById("loadingModal").classList.remove("hidden");
    document.getElementById("loadingModal").classList.add("flex");
}

function hideLoader() {
    // Ye function loading modal ko chupayega
    document.getElementById("loadingModal").classList.add("hidden");
    document.getElementById("loadingModal").classList.remove("flex");
}

// --- UPDATED analyzeDressCondition Function (Error Handling Better kiya) ---
async function analyzeDressCondition(imageFile) {
    // ... (Aapka API Key aur URL code same rahega) ...
    const API_KEY = window.WEDRENTIFY_GEMINI_API_KEY || "";
    if (!API_KEY) {
        alert("Dress condition AI is not configured. Add a key in config.local.js or continue without AI.");
        return "Error";
    }
    
    try {
        const supportedTypes = ["image/jpeg", "image/png", "image/webp"];
        if (!supportedTypes.includes(imageFile.type)) {
            alert(`❌ Error: Unsupported file type: ${imageFile.type}. Please upload JPEG, PNG, or WEBP.`);
            // Agar file type galat hai to "Error" return karega
            return "Error"; 
        }

        const imageBase64 = await toBase64(imageFile); 
        const mimeType = imageFile.type || "image/jpeg";
        const API_URL = 
            `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
            
        // ... (Aapka fetch call aur body same rahega) ...
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [
                    {
                        parts: [
                            {
                                text:`You are a meticulous professional dress inspector. 
Scrutinize the image for defects like tears, large stains, dirt, or holes.
Analyze the dress condition and classify it as *exactly one* of the following three categories:
- Good (Must be absolutely flawless and look brand new)
- Fair (Has minor but noticeable blemishes, wrinkles, or small, light stains)
- Damaged (Has clear tears, visible holes, or large, dark stains)
Return ONLY one of these words: Good, Fair, or Damaged.`
                            },
                            {
                                inline_data: {
                                    mime_type: mimeType,
                                    data: imageBase64
                                }
                            }
                        ]
                    }
                ]
            })
        });

        const result = await response.json();
        
        if (!response.ok) {
            console.error("Gemini API Error:", result);
            const errorMessage = result.error?.message || response.statusText;
            alert(`❌ Gemini API failed. Status: ${response.status}. Error: ${errorMessage}`);
            return "Error"; // API error hone par "Error" return karega
        }

        const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        // Sirf 'Good', 'Fair', 'Damaged' ya 'Error' return karega
        return aiText || "Error"; 
        
    } catch (error) {
        console.error("Network or Internal error:", error);
        alert("❌ A JavaScript error occurred during AI analysis. Check console.");
        return "Internal Error"; // Network error hone par "Internal Error" return karega
    }
}


// --- UPDATED submitWithDeposit Function ---
async function submitWithDeposit() {
    const cvc = document.getElementById("cvcInput").value;
    if (!cvc || cvc.length < 3) {
        alert("❌ Enter valid CVC!");
        return;
    }

    // Deposit Modal ko band karein
    closeModal(); 

    const sellerUsername = localStorage.getItem("sellerUsername");
    if (sellerUsername) cachedFormData.append("seller_username", sellerUsername);
    cachedFormData.append("cvc", cvc);

    const useDamageDetection = confirm("Do you want to use AI Damage Detection?");
    let aiCondition = ""; // Default value empty string

    if (useDamageDetection) {
        const imgFile = cachedFormData.get("image");
        
        if (imgFile && imgFile.size > 0) {
            
            // 1. 🔥 AI Analysis ke liye Loader dikhao
            showLoader("AI is analyzing the dress condition...");
            
            aiCondition = await analyzeDressCondition(imgFile); 

            // 2. 🔥 API ka response aate hi Loader chhupa do
            hideLoader(); 

            // Check for critical errors (jo humne analyzeDressCondition mein define kiye hain)
            if (aiCondition === 'Error' || aiCondition === 'Internal Error') {
                 // Error alert pehle hi dikha diya gaya hai. Ab submission ko rok do.
                 // Aur aiCondition ko empty string rehne do (ya "Error" bhej do)
                 cachedFormData.append("ai_condition", ""); 
                 return; 
            }
            
            // AI Condition ko form data mein add karo
            alert("AI Condition: " + aiCondition);
            cachedFormData.append("ai_condition", aiCondition);
           

        } else {
            alert("❌ No image file found! Please select an image.");
            return; 
        }
    } else {
        // Agar user ne detection skip kiya
        cachedFormData.append("ai_condition", "Not Checked");
    }

    // --- Final Submission ---

    // 3. 🔥 Submission ke liye dobara Loader dikhao
    showLoader("Submitting dress details...");
    
    const res = await fetch("http://127.0.0.1:8000/api/rentals/add-dress/", {
        method: "POST",
        body: cachedFormData,
    });
    
    // 4. 🔥 Submission complete hone par Loader chhupa do
    hideLoader(); 

    const result = await res.json();
    if (res.ok) {
        alert("✅ Dress submitted successfully!"); // Successful message
        window.location.href = "SellerDresses.html";
    } else {
        alert("❌ Error: " + (result.error || "Something went wrong"));
    }
}

    // ✅ Logout function
    function logoutSeller() {
      localStorage.removeItem("sellerUsername");
      window.location.href = "login.html";
    }
