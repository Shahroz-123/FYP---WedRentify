<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup as Seller | WedRentify</title>
  <link rel="stylesheet" href="signup-seller.css" />
  
<style>
/* Add these styles for the modal appearance */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content {
    background: white;
    padding: 30px;
    border-radius: 8px;
    text-align: center;
    width: 300px;
}
.modal-content input, .modal-content button {
    margin: 10px 0;
    padding: 10px;
    width: 100%;
}
</style>
</head>
<body>
  <div class="signup-container">
    <h1 >Seller Signup - WedRentify</h1>
    <form id="signupForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="text" id="cnic" placeholder="CNIC (e.g., 35201-1234567-8)" required />
      <input type="text" id="phone" placeholder="Phone Number" required />
      <input type="email" id="email" placeholder="Email" required />

      <button type="submit">Signup</button>
    </form>
    <p class="login-line">Already have an account? <a href="login.html">Login Now</a></p>
  </div>
<div id="verification-modal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <h2 style="color: red;">Verify Email Address</h2>
    <p>A verification code has been sent to your email.</p>
    <input type="text" id="verificationCode" placeholder="Enter 6-digit Code" maxlength="6">
    <button id="verifyButton">Verify Account</button>
    <button id="cancelVerify">Cancel</button>
    <p id="modalMessage" style="color: red;"></p>
  </div>
</div>

  <script src="signup-seller.js">
    
  </script>
</body>
</html>
