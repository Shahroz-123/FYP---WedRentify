    .pop-out-button {
  padding: 12px 24px;         /* Adjust padding as needed */
  border-radius: 50px;        /* Makes it fully rounded */
  border: none;
  font-size: 16px;
  font-weight: 600;
 /* Example background color */
  cursor: pointer;
  
  /* --- This is the secret sauce --- */
  /* Tells the browser to animate changes to 'transform' and 'box-shadow' */
  /* It takes 0.3 seconds and has an 'ease' effect */
  transition: transform 0.3s ease, box-shadow 0.3s ease; 
}

/* 2. The :hover state (when the mouse is over it) */
.pop-out-button:hover {
  /* Scales the button to 110% of its original size */
  transform: scale(1.1); 
   transform: translateY(-2px); /* Subtle lift effect */
    box-shadow: 0 6px 20px rgba(238, 115, 115, 0.6);
}
/* 1. Define the continuous "pulse" animation
*/
@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05); /* A subtle 5% grow */
  }
  100% {
    transform: scale(1);
  }
}

  <script>
    const isLoggedIn = localStorage.getItem("isLoggedIn");
const navLoginCart = document.querySelector(".nav-login-cart"); // ✅ fix added

if (isLoggedIn === "true") {
  navLoginCart.innerHTML = `
    <button id="logoutBtn" class="bg-red-700 text-white px-3 py-1 rounded hover:bg-red-800">Logout</button>
    <a href="cart.html"></a>
 
  `;

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("buyer_id");
    localStorage.removeItem("buyer_username");
    window.location.href = "index.html";
  });
} else {
  navLoginCart.innerHTML = `
    <a href="login.html"><button>Login</button></a>
    <a href="cart.html"></a>
    
  `;
}

    const container = document.getElementById("venueContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");

    let currentPage = 1;
    const itemsPerPage = 12;
    let venues = [];

    async function loadVenues() {
      container.innerHTML = "<p>Loading venues...</p>";

      try {
     const response = await fetch("http://127.0.0.1:8000/api/wedrentify_admin/venues/list/");

        if (!response.ok) throw new Error("Network error");
        venues = await response.json();
        renderPage();
      } catch (error) {
        console.error("Error loading venues:", error);
        container.innerHTML = "<p>Failed to load venues. Check API or server.</p>";
      }
    }

    function renderPage() {
      container.innerHTML = "";
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const venuesToShow = venues.slice(startIndex, endIndex);

      if (venuesToShow.length === 0) {
        container.innerHTML = "<p>No venues found.</p>";
        return;
      }

      venuesToShow.forEach(venue => {
        const shortDescription = venue.description
          ? venue.description.split(" ").slice(0, 70).join(" ") + "..."
          : "A beautiful venue perfect for weddings and events.";

        const card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `
          <img src="${venue.image}" alt="${venue.name}" />
          <div class="p-text-con">
            <div class="p-card-text">
              <h1>${venue.name}</h1>
            
              <p>${shortDescription}</p>
            </div>
              <p class="city"><b>City:</b> ${venue.city}</p>
            <div class="p-price">
              <h2>Contact: ${venue.whatsapp_number || venue.contact_number || 'N/A'}</h2>
            </div>
            
                <div class="p-price">
              <h2>Per Head:  ${venue.per_head_price || "N/A"}Rs</h2>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      updatePagination();
    }

    function updatePagination() {
      const totalPages = Math.ceil(venues.length / itemsPerPage);
      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    });

    nextBtn.addEventListener("click", () => {
      const totalPages = Math.ceil(venues.length / itemsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    });

    loadVenues();

  </script>
