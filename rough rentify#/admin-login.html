<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - WedRentify</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md border border-red-300">
    <h2 class="text-2xl font-bold text-red-700 text-center mb-6">Admin Login - WedRentify</h2>
    <form action="/admin/login" method="POST">
      <!-- Username field -->
      <div class="mb-4">
        <label for="username" class="block text-red-700 mb-1 font-semibold">Username</label>
        <input type="text" id="username" name="username" required class="w-full px-4 py-2 border border-red-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      
      <!-- Email field -->
      <div class="mb-4">
        <label for="email" class="block text-red-700 mb-1 font-semibold">Email</label>
        <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-red-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      
      <!-- Password field -->
      <div class="mb-6">
        <label for="password" class="block text-red-700 mb-1 font-semibold">Password</label>
        <input type="password" id="password" name="password" required class="w-full px-4 py-2 border border-red-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      
      <!-- Submit button -->
      <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-md hover:bg-red-700 transition login-btn">Login</button>
    </form>
    <p class="mt-4 text-sm text-center text-gray-600 incorrect" ></p>
  </div>
  
  <script src="admin-login .js"></script>
</html>
