<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management</title>
  <!-- Tailwind CSS is used for some basic layout and styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* --- CUSTOM CSS FOR STYLING --- */
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f9fafb; /* Lighter gray background */
    }

    /* Table headers and cells styling */
    th, td {
        text-align: left;
        padding: 14px 18px;
        border-bottom: 1px solid #dc2626; ; /* Softer border color */
        white-space: nowrap; /* Prevents text from wrapping */
    }

    thead th {
        background-color: #f3f4f6; /* Light gray header */
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem; /* 12px */
        color:#dc2626;  /* Darker gray text */
    }

    tbody tr:hover {
        background-color: #f9fafb;
    }
    
    /* Search, Delete, and Back Buttons */
    .btn {
        padding: 0.6rem 1.5rem;
        border: none;
        border-radius: 0.375rem; /* 6px */
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease-in-out;
    }
    .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .search-btn {
        background-color: #991b1b; /* Darker Red */
        color: white;
    }
    .delete-btn {
        background-color: #dc2626; /* Bright Red */
        color: white;
        padding: 0.5rem 1rem;
    }
    .back-btn {
        background-color:#dc2626; ; /* Medium Gray */
        color: white;
        padding: 0.75rem 2rem;
    }

    /* This is the highlight style for the searched row */
    .highlight {
        background-color: #fee2e2 !important; /* Light Red */
        transition: background-color 0.5s ease;
    }
    .thead{background-color: red!important;}
  </style>
</head>
<body>

  <div class="container mx-auto p-4 md:p-8">
    <header class="mb-8">
      <h1 class="text-4xl font-bold text-gray-800" style="color:  #d62828;">Orders Management</h1>
      <p class="text-gray-500 mt-1" style="color: #d62828">View, search, and manage all customer orders.</p>
    </header>

    <!-- Search Section -->
    <div class="search-container bg-white p-4 rounded-lg shadow-sm mb-6 flex items-center gap-4">
      <input type="text" id="searchInput" placeholder="Search by Order No (e.g., 1, 2, 3...)" class="flex-grow p-2 border rounded-md focus:ring-2 focus:ring-red-500 focus:outline-none">
      <button onclick="searchOrder()" class="btn search-btn">Search</button>
    </div>

    <!-- Orders Table -->
    <div class="overflow-x-auto bg-red rounded-lg shadow">
      <table class="min-w-full" id="ordersTable">
        <thead class="bg-red-200 thead">
          <tr>
            <th>Order No</th>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Seller</th>
            <th>Seller Contact</th>
            <th>Buyer Username</th>
            <th>Buyer Email</th>
            <th>Postal Code</th>
            <th>City</th>
            <th>Purchase Date</th>
            <th>Full Name</th>
            <th>Address</th>
            <th>Phone No</th>
            <th>Created At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Data will be loaded here by JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- Back to Home Button -->
    <div class="mt-8 text-center">
      <button onclick="window.location.href='admin.html'" class="btn back-btn">
        Back to Dashboard
      </button>
    </div>
  </div>

  <script>
    // --- JAVASCRIPT LOGIC ---

    // Wait for the HTML content to be fully loaded before running the script
    document.addEventListener('DOMContentLoaded', fetchOrders);

    // Global variable to store all orders so we don't have to re-fetch
    let allOrders = [];

    /**
     * Fetches all orders from the API and renders them in the table.
     */
    async function fetchOrders() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '<tr><td colspan="15" class="text-center p-4">Loading orders...</td></tr>';

        try {
            // *** THE TYPO IN THE URL HAS BEEN CORRECTED HERE ***
            const response = await fetch("http://127.0.0.1:8000/api/rentals/my-orders/");
            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }
            allOrders = await response.json();
            renderTable(allOrders);
        } catch (error) {
            console.error("Failed to fetch orders:", error);
            tableBody.innerHTML = `<tr><td colspan="15" class="text-center p-4 text-red-600 font-semibold">Failed to load orders. Please check if the API is running and there are no CORS issues.</td></tr>`;
        }
    }

    /**
     * Renders the provided orders data into the HTML table.
     * @param {Array} orders - An array of order objects.
     */
    function renderTable(orders) {
        const tableBody = document.getElementById('tableBody');
        
        if (orders.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="15" class="text-center p-4">No orders found.</td></tr>';
            return;
        }

        tableBody.innerHTML = orders.map(order => `
            <tr data-order-no="${order.order_no}">
                <td>${order.order_no}</td>
                <td>${order.product_id}</td>
                <td>${order.product_name}</td>
                <td>${order.seller_username}</td>
                <td>${order.seller_contact || 'N/A'}</td>
                <td>${order.username}</td>
                <td>${order.email}</td>
                <td>${order.postal_code}</td>
                <td>${order.city}</td>
                <td>${new Date(order.purchase_date).toLocaleDateString()}</td>
                <td>${order.full_name}</td>
                <td>${order.address}</td>
                <td>${order.phone_number}</td>
                <td>${new Date(order.created_at).toLocaleString()}</td>
                <td>
                    <button class="btn delete-btn" onclick="deleteOrder(${order.order_no})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    /**
     * Searches for an order by its ID and highlights the corresponding row.
     */
    function searchOrder() {
        const searchInput = document.getElementById('searchInput').value.trim();
        const rows = document.querySelectorAll('#tableBody tr');

        // First, remove highlight from all rows
        rows.forEach(row => row.classList.remove('highlight'));

        if (!searchInput) {
            return; // Do nothing if search is empty
        }

        const targetRow = document.querySelector(`tr[data-order-no='${searchInput}']`);
        
        if (targetRow) {
            targetRow.classList.add('highlight');
            // Scroll the highlighted row into view for better user experience
            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert(`Order with No "${searchInput}" not found.`);
        }
    }

    /**
     * Deletes an order after confirmation.
     * @param {number} orderNo - The ID of the order to delete.
     */
     async function deleteOrder(orderNo) {
        // Confirmation dialog to prevent accidental deletion
        if (!confirm(`Are you sure you want to delete Order No #${orderNo}? This action cannot be undone.`)) {
            return;
        }

        try {
            // This URL matches the Django URL you created
            const response = await fetch(`http://127.0.0.1:8000/api/rentals/orders/${orderNo}/delete/`, {
                method: 'DELETE',
                // CSRF token might be needed depending on your Django setup
                // headers: { 'X-CSRFToken': 'YOUR_CSRF_TOKEN' } 
            });

            if (!response.ok) {
                // If the server returns an error, try to show it
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || `Server responded with status: ${response.status}`);
            }

            // If deletion is successful, remove the row from the table visually
            const rowToDelete = document.querySelector(`tr[data-order-no='${orderNo}']`);
            if (rowToDelete) {
                rowToDelete.remove();
            }
            
            // Also update the global 'allOrders' array to reflect the change
            allOrders = allOrders.filter(order => order.order_no !== orderNo);

            alert(`Order #${orderNo} has been deleted successfully.`);

        } catch (error) {
            console.error("Failed to delete order:", error);
            alert(`Could not delete order. Error: ${error.message}`);
        }
    }
  </script>
</body>
</html>
